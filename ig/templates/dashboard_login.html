<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Kirish · PlutoSoft Inbox</title>
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='dashboard.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand brand-login" href="/dashboard/login" aria-label="PlutoSoft Inbox">
      <span class="brand-mark">P</span>
      <span>pluto<span class="brand-soft">soft</span><small>UNIFIED INBOX</small></span>
    </a>
    <div class="login-orbit" aria-hidden="true"><span></span><i></i><b></b></div>
    <p class="eyebrow">XUSH KELIBSIZ</p>
    <h1>Suhbatlar<br>bir joyda.</h1>
    <p class="login-description">Instagram va Telegram mijozlari bilan suhbatlarni kuzatish uchun davom eting.</p>
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('dashboard.login_submit') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">Dashboard paroli</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Parolni kiriting" required autofocus>
      <button class="primary-button login-button" type="submit">Inbox'ga kirish <span>→</span></button>
    </form>
    <p class="login-foot"><span class="lock-icon">⌑</span> Himoyalangan boshqaruv paneli</p>
  </main>
</body>
</html>
